<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Norhan AI Agent</title>
</head>

<body>

    <h1>Norhan AI Agent 🤖</h1>

    <p>Welcome to my Personal AI Agent.</p>

    <input type="text" id="userInput" placeholder="Ask me something...">

    <button onclick="askAgent()">Ask Agent</button>

    <p id="response"></p>

    <script>
        function askAgent() {
            const input = document.getElementById("userInput").value;
            const response = document.getElementById("response");

            if (input.trim() === "") {
                response.textContent = "Please enter a question.";
                return;
            }

            response.textContent =
                "Thanks for your question! My AI Agent is processing: " + input;
        }
    </script>

</body>
</html>
